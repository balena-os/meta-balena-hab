BBPATH =. "${LAYERDIR}:"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "balena-hab"
BBFILE_PATTERN_balena-hab = "^${LAYERDIR}/"
BBFILE_PRIORITY_balena-hab = "1337"
LAYERSERIES_COMPAT_balena-hab = "scarthgap"

BALENA_NONENC_BOOT_LABEL = "balena-imx"
BALENA_USE_LUKS = "0"

# The SPL authenticates the FIT FDT with its own CSF (CONFIG_IMX_SPL_FIT_FDT_SIGNATURE)
# instead of checking the hash of it that imx-mkimage stores after the SPL. U-Boot
# has to be built with this option, and the imx-boot image has to be signed, to match
HAB_FIT_FDT_SIGNATURE ?= "0"
HAB_FIT_FDT_SIGNATURE:iot-gate-imx8plus = "1"

# Addresses the kernel bundle and the device tree are signed for. U-Boot only
# authenticates them where it loads them, so its environment has to load them
# at these addresses. The U-Boot recipes set and check that from these.
HAB_KERNEL_LOAD_ADDR ?= "0x40480000"
HAB_DTB_LOAD_ADDR ?= "0x48480000"
